[project]
name = "mechine-learning-lsr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yj", email = "529156674@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "joblib>=1.4",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-docx>=1.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "shap>=0.52.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
boosting = [
    "xgboost>=3.4.1",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
mechine-learning-lsr = "mechine_learning_lsr:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
